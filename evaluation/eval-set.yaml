# 评测集定义
# 版本：0.1.0
# 说明：POC 阶段执行 10-12 个测试用例

config:
  eval_set_version: "0.3.0"
  model: "configured-model-id"
  project: "help-center-search"

test_groups:
  - group: contextual
    label: "Context 分支"
    cases:
      - CTX-01
      - CTX-02
      - CTX-03
      - CTX-04
      - CTX-05
      - CTX-06
      - CTX-07
      - CTX-08
      - CTX-09
      - CTX-10
      - CTX-11
  - group: prd
    label: "PRD 分支"
    cases:
      - PRD-01
      - PRD-02
      - PRD-03
      - PRD-04
      - PRD-05
      - PRD-06
      - PRD-07
      - PRD-08
      - PRD-09
      - PRD-10
      - PRD-11
      - PRD-12
  - group: change
    label: "修改与重规划"
    cases: []
  - group: harness
    label: "Harness 控制"
    cases: []
